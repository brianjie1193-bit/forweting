<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>湯惟婷，我有話想對你說... 💕</title>
                <!--<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湯惟婷，我有話想對你說... 💕</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN for heart confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome for cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Zen Maru Gothic / Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sakura-pink': '#FFB7C5',
                        'cream-yellow': '#FFF9E6',
                        'soft-rose': '#FF8095',
                        'sweet-red': '#FF4D6D',
                        'deep-rose': '#C9184A',
                    },
                    fontFamily: {
                        cute: ['"Zen Maru Gothic"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-fast': 'pulse 1s infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-12px) rotate(3deg)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-4deg)' },
                            '50%': { transform: 'rotate(4deg)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #FFE5EC 0%, #FFF0F5 50%, #E8E8FF 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* 飄落愛心背景動畫 */
        .heart-bg {
            position: absolute;
            pointer-events: none;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* 按鈕立體與微調效果 */
        .btn-cute {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(255, 128, 149, 0.3);
        }

        .btn-cute:active {
            transform: scale(0.92) translateY(2px);
        }

        /* 卡片切換過渡 */
        .step-card {
            display: none;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .step-card.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 移動端閃爍卡片邊框 */
        .glow-card {
            box-shadow: 0 15px 35px -5px rgba(255, 154, 162, 0.4),
                        0 0 15px rgba(255, 255, 255, 0.8) inset;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

    <!-- 背景動態愛心容器 -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- 主要告白卡片容器 -->
    <main class="relative z-10 w-full max-w-md">
        
        <!-- STEP 1: 你好 -->
        <div id="step1" class="step-card active flex-col items-center justify-center bg-white/80 backdrop-blur-md rounded-3xl p-8 border-4 border-pink-200 glow-card text-center relative">
            <div class="relative mb-6">
                <!-- 萌萌小兔子/熊熊大頭貼圖片 -->
                <div class="w-32 h-32 rounded-full bg-pink-100 flex items-center justify-center border-4 border-white shadow-inner animate-float">
                    <span class="text-7xl">🙋🏻‍♂️</span>
                </div>
                <div class="absolute -top-2 -right-2 bg-pink-400 text-white rounded-full p-2 text-xs font-bold animate-bounce">
                    ✨ Hi! ✨
                </div>
            </div>

            <h1 class="text-4xl font-black text-rose-500 mb-3 tracking-wide drop-shadow-sm">
                你好呀！👋
            </h1>
            <p class="text-gray-600 text-lg mb-8 font-medium">
                悄悄點開這張卡片...<br>有一句話想告訴你喔～
            </p >

            <button onclick="goToStep(2)" class="btn-cute px-8 py-4 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-bold text-xl rounded-full tracking-wider flex items-center gap-2 transform hover:scale-105">
                <span>繼續看下去</span>
                <i class="fa-solid fa-heart animate-pulse"></i>
            </button>
        </div>

        <!-- STEP 2: 想我嗎？ -->
        <div id="step2" class="step-card flex-col items-center justify-center bg-white/80 backdrop-blur-md rounded-3xl p-8 border-4 border-pink-200 glow-card text-center relative">
            <div class="relative mb-6">
                <div class="w-32 h-32 rounded-full bg-yellow-100 flex items-center justify-center border-4 border-white shadow-inner animate-wiggle">
                    <span class="text-7xl">🥺👉👈</span>
                </div>
            </div>

            <h2 class="text-3xl font-black text-rose-500 mb-2">
                問你一個問題喔...
            </h2>
            <p class="text-2xl font-bold text-gray-700 mb-8">
                你有想我嗎？💭
            </p >

            <div class="flex gap-4 w-full justify-center items-center relative min-h-[60px]" id="btn-group">
                <!-- 想！按鈕 -->
                <button id="yesBtn" onclick="goToStep(3)" class="btn-cute px-8 py-3.5 bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white font-bold text-xl rounded-full z-10 transform hover:scale-110">
                    超級想！❤️
                </button>

                <!-- 不想 按鈕 (會調皮躲開) -->
                <button id="noBtn" onmouseover="dodgeButton()" onclick="dodgeButton()" class="btn-cute px-6 py-3.5 bg-gray-200 text-gray-600 font-bold text-lg rounded-full transition-all duration-200 border-2 border-gray-300">
                    不想 😜
                </button>
            </div>
        </div>

        <!-- STEP 3: 我也想你喔 -->
        <div id="step3" class="step-card flex-col items-center justify-center bg-white/80 backdrop-blur-md rounded-3xl p-8 border-4 border-pink-200 glow-card text-center relative">
            <div class="relative mb-6">
                <div class="w-32 h-32 rounded-full bg-pink-200 flex items-center justify-center border-4 border-white shadow-inner animate-bounce-slow">
                    <span class="text-7xl">🥰💖</span>
                </div>
            </div>

            <h2 class="text-3xl font-black text-rose-500 mb-4 animate-pop">
                嘿嘿～<br>我也超想你喔！✨
            </h2>
            <p class="text-gray-600 text-lg mb-8 font-medium">
                好啦！<br>其實...最重要的一句話是...
            </p >

            <button onclick="goToStep(4)" class="btn-cute px-8 py-4 bg-gradient-to-r from-rose-400 to-sweet-red hover:from-rose-500 hover:to-sweet-red text-white font-bold text-xl rounded-full tracking-wider flex items-center gap-2 transform hover:scale-105 animate-pulse">
                <span>點擊揭曉大驚喜 🎉</span>
            </button>
        </div>

        <!-- STEP 4: 湯惟婷！我喜歡你喔！ -->
        <div id="step4" class="step-card flex-col items-center justify-center bg-white/90 backdrop-blur-md rounded-3xl p-8 border-4 border-rose-300 glow-card text-center relative">
            
            <!-- 可愛愛心頭像組合 -->
            <div class="relative mb-6">
                <div class="w-36 h-36 rounded-full bg-gradient-to-tr from-pink-300 to-rose-300 flex items-center justify-center border-4 border-white shadow-lg animate-float">
                    <span class="text-8xl">👩‍❤️‍💋‍👨</span>
                </div>
                <div class="absolute -bottom-2 -right-2 bg-sweet-red text-white p-3 rounded-full shadow-md animate-bounce">
                    <i class="fa-solid fa-heart text-xl"></i>
                </div>
            </div>

            <!-- 告白對象名字與告白詞 -->
            <div class="space-y-3 mb-6">
                <span class="inline-block px-4 py-1.5 bg-rose-100 text-rose-600 font-bold rounded-full text-sm">
                    ✨ 特別獻給最可愛的你 ✨
                </span>
                <h1 class="text-4xl sm:text-5xl font-black text-sweet-red tracking-wide drop-shadow-md">
                    湯惟婷！
                </h1>
                <p class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wider">
                    我喜歡你喔！❤️
                </p >
            </div>

            <p class="text-gray-600 text-base mb-8 leading-relaxed font-medium bg-pink-50 p-4 rounded-2xl border border-pink-100">
                今天也會想你的～<br>
                我知道你也會想我！對吧！🌸
            </p >

            <!-- 重新播放按鈕 -->
            <button onclick="goToStep(1)" class="px-6 py-2.5 bg-pink-100 hover:bg-pink-200 text-pink-600 font-bold text-sm rounded-full transition-colors flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>再看一次告白</span>
            </button>
        </div>

    </main>

    <script>
        // 初始化背景漂浮愛心
        function createBackgroundHearts() {
            const container = document.getElementById('hearts-container');
            const heartIcons = ['💖', '💗', '🌸', '💕', '✨', '❤️'];
            const heartCount = 20;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                
                // 隨機位置與動畫延遲
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.fontSize = `${Math.random() * 20 + 16}px`;
                heart.style.animationDuration = `${Math.random() * 5 + 6}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(heart);
            }
        }

        // 步驟切換函數
        function goToStep(stepNumber) {
            // 隱藏所有卡片
            const cards = document.querySelectorAll('.step-card');
            cards.forEach(card => card.classList.remove('active'));

            // 重置躲避按鈕位置
            const noBtn = document.getElementById('noBtn');
            if (noBtn) {
                noBtn.style.position = 'static';
                noBtn.style.transform = 'none';
            }

            // 顯示目標卡片
            setTimeout(() => {
                const targetCard = document.getElementById(`step${stepNumber}`);
                if (targetCard) {
                    targetCard.classList.add('active');
                }

                // 如果是第四步，引爆愛心彩帶與慶祝特效
                if (stepNumber === 4) {
                    triggerConfetti();
                }
            }, 100);
        }

        // 淘氣的「不想」按鈕躲避邏輯
        let dodgeCount = 0;
        function dodgeButton() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            dodgeCount++;

            // 讓「想！」按鈕變大，更具吸引力
            let currentScale = 1 + dodgeCount * 0.15;
            if (currentScale < 2) {
                yesBtn.style.transform = `scale(${currentScale})`;
            }

            // 隨機移動「不想」按鈕
            const x = (Math.random() - 0.5) * 260;
            const y = (Math.random() - 0.5) * 200;

            noBtn.style.position = 'relative';
            noBtn.style.transform = `translate(${x}px, ${y}px)`;

            // 改變按鈕文字，增添俏皮感
            const funnyTexts = ['抓不到我～', '再想想看嘛！', '真的不選想嗎？', '不可以選這個！', '一定要選想！'];
            noBtn.innerText = funnyTexts[dodgeCount % funnyTexts.length];
        }

        // 慶祝愛心彩條特效 (Canvas Confetti)
        function triggerConfetti() {
            // 連續發射愛心與粉色彩帶
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 40 * (timeLeft / duration);

                // 從左側與右側同時發射
                confetti({
                    particleCount,
                    startVelocity: 30,
                    spread: 360,
                    ticks: 60,
                    origin: { x: Math.random(), y: Math.random() - 0.2 },
                    colors: ['#FFB7C5', '#FF8095', '#FF4D6D', '#FFF9E6', '#FFC6FF'],
                    shapes: ['circle', 'square']
                });
            }, 250);
        }

        // 頁面載入完成後執行
        window.onload = function() {
            createBackgroundHearts();
        };
    </script>
</body>
</html>
